<style>

a{color:inherit}

.tile{text-decoration:none;display:block}
.img{aspect-ratio:4/3;border-radius:16px;background:linear-gradient(135deg,var(--c1),var(--c2));background-size:cover;background-position:center;position:relative}
.cap{font-size:.85rem;color:var(--mute);margin:10px 0 0;text-align:left;line-height:1.4}
.big{font-size:clamp(1.8rem,3.6vw,2.6rem);margin-bottom:18px}
.opt:empty{display:none}body.edit .opt:empty{display:block;min-height:1.3em}
.sbox{position:relative;aspect-ratio:485/402;border-radius:16px;overflow:hidden;border:1px solid var(--line)}.sbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tb{white-space:pre-wrap;word-break:break-word;margin:0}body.edit .tb:empty{min-height:8em}
.editonly{display:none}body.edit .editonly{display:block}
.img.wide{aspect-ratio:21/9}
.img.empty{display:none}body.edit .img.empty{display:block}
.tile h3{margin:14px 0 4px}.tile p{margin:0;color:var(--mute);font-size:.92rem}
.pill{display:inline-block;background:var(--alt);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.8rem;color:var(--mute);margin-bottom:10px}
.sec p{max-width:70ch;white-space:pre-line}
.crit{display:grid;grid-template-columns:1fr 1fr;gap:32px 40px;margin-top:28px}
.crit h3{margin-bottom:6px}.crit p{margin:0;color:var(--mute)}
.back{display:inline-block;margin-bottom:24px;color:var(--ink)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
#tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;gap:8px;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center}
body.edit [data-k]{outline:1px dashed var(--brand);outline-offset:3px;cursor:text;min-width:2ch}
body.edit .img{cursor:pointer;outline:2px dashed var(--brand);outline-offset:3px}
body.edit .img::after{content:"Click to change image";position:absolute;inset:auto 10px 10px auto;background:var(--brand);color:var(--on);font-size:.75rem;padding:3px 10px;border-radius:8px}
body.edit [data-k]:empty::before{content:"Type here…";color:var(--mute)}
.del{display:none}body.edit .del{display:inline-block;margin-top:10px}
@media(max-width:760px){.two,.cards,.grid,.crit,.hero{grid-template-columns:1fr}nav{grid-template-columns:1fr auto}nav .t{display:none}.w{padding:44px 20px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<script>window.FINAL={"site": "Computational Thinking in Mathematics", "heroTitle": "COMPUTATIONAL THINKING THROUGH INTEGRATED MATHEMATICS LEARNING ", "intro": "Computational thinking is thinking systematically to understand, solve and evaluate problems. It is not limited to computer programming. It is usually described through six overlapping skills: decomposition, pattern recognition, abstraction, algorithm, logical thinking and evaluation.", "c1t": "Decomposition", "c1p": "Breaking a complex problem into smaller, manageable part.", "c2t": "Pattern recognition ", "c2p": "Identifying similarities, repetitions, trends or relationship in information.", "c3t": "Abstraction", "c3p": "Identifying the important information and actively ignoring unnecessary details to comtrust a simplified representation of the problem.", "c4t": "Algorithms", "c4p": "A clear, ordered sequence of steps usd to solve a problem or accomplish a task.", "c5t": "Logical reasoning", "c5p": "Using fact, relationships, rules and evidence to reach a valid, justifiable conclusion.", "c6t": "Evaluation", "c6p": "Checking, testing and judging whether a solution is correct, efficient, appropriate and reasonable.\n\n\n", "ctaT": "Read the four activity analyses", "ctaP": "Each page sets out the objective, materials, step-by-step procedure, the computational thinking skills used, and a full critical analysis.", "workT": "Four activities, one algebra strand", "workP": "Two unplugged, two plugged-in — each analysed for the computational thinking it draws on.", "heroCap": "Made By : ISAAC KHIU CHEE YEW MT1", "introHead": "WHAT IS COMPUTATIONAL THINKING?", "acts": [{"type": "Unplugged", "title": "ALGEBRA BALANCE CHALLENGE: SOLVING LINEAR EQUATIONS \n", "blurb": "Unplugged activity — linear equations\n", "c1": "#c8372d", "c2": "#e8b923", "obj": "This activity help students understand the concept of equality in algebra and solve simple linear equations using physical objects.\n", "mat": "1. A simple beam balance (a ruler resting on a pencil)\n2. Small boxes\n3. Paper and pencil\n4. A set of equation cards (e.g. 2x + 3 = 11)\n", "proc": "1. Divide students into small groups.\n2. Give each group an equation card, such as x + 2 = 6.\n3. Students represent the equation using objects:\n        Unknown x → Small boxes labelled \"x\" \n        Numbers  →  Identical boxes \n4. Students maintain the balance (equality) by removing or adding the same number of objects to both sides.\n5. Students gradually isolate x.\n6. Students record each step as an algebraic equation.\n7. Students check their answer by substituting the value of x back into the original equation.\n8. Repeat with two more equation cards of increasing difficulty.\n8. Groups explain the steps they used and compare their methods.", "skills": "Decomposition \nBreak the equation into smaller parts, such as 2x, +2, and =10.\n\nPattern Recognition \nRecognise that the same operation must be performed on both sides.\n\nAlgorithm \nFollow a sequence: simplify → isolate the variable → solve → check.\n\nLogical Reasoning\nDetermine which operation is needed to isolate x.\n\nEvaluation\nSubstitute the answer back into the original equation to verify it.\n", "s": "The physical, hands-on nature of the balance makes the abstract rule “do the same to both sides” concrete and memorable, and it needs no equipment beyond everyday classroom materials.", "e": "The activity is effective for helping students understand the steps involved in solving linear equations. Students can visually see why the same operation must be performed on both sides.", "l": "Physical materials may also be difficult to prepare or manage for a large class. Some students may focus more on manipulating the objects than understanding the underlying algebraic concept.", "i": "Provide equations with different difficulty levels according to students' abilities.The activity can also be followed by individual algebra questions to ensure students can apply the concept without physical objects. A digital version could be added as a plugged-in activity for further practice.", "img": "images/activity-1.jpg"}, {"type": "Unplugged", "title": "ICE-CREAM STICK STAIRCASES:  PATTERN DETECTIVE", "blurb": "Unplugged activity — progressions", "c1": "#1e88c8", "c2": "#e8b923", "obj": "This activity allow student easily understand the concept of progression or pattern by using physical model such as staircases. ", "mat": "1. A box of ice-cream sticks\n2. Coloured pencils\n3. Paper and pencil\n", "proc": "1. In groups of three, students build Step 1 of a staircase pattern using ice-cream sticks (4 ice-cream sticks for one square step) and record the count.\n2. Students build Step 2 by adding more toothpicks to extend the staircase, then record the new total.\n3. Students continue to Step 3 and Step 4, using a different coloured pencil each time to mark only the toothpicks that were added, making the common difference visible.\n4. Groups complete the recording table for n = 1 to 5 and describe, in their own words, the fixed number of toothpicks added at every step.\n5. Groups use the first term and the common difference from their table to write a general formula for the nth step.\n6. Test it by predicting Step 6 before building it.\n6. Check the formula against several figures to test the accuracy.\n", "skills": "Decomposition\nStudent break the pattern into repeated components and examine how each figure is constructed.\n\nPattern Recognition\nStudent identify the constant constant number of toothpicks added at every step.\n\nAlgorithm\nFollow steps to construct → count → compare → predict → formulate a rule.\n\nLogical Reasoning\nExplain why the general formula works for every step of staircase.\n\nEvaluation\nTest the formula to determine whether it is correct.\n", "s": "This activity makes pattern more visual because students physically add pieces at each step, the constant difference d is something they can see and touch, not just calculate.\n", "e": "This activity make pattern learning proses become enjoyable throughout the adding and finding common increase of ice-cream stick.", "l": "Students may identify the pattern but struggle to express it using an algebraic formula.", "i": "Provide patterns with different levels of difficulty to accommodate different abilities.", "img": "images/activity-2.jpg"}, {"type": "Plugged-in", "title": "NUMBER PATTERN GAME: FOLLOWING THE FROG\n", "blurb": "Plugged-in activity — Scratch", "c1": "#8a5a3c", "c2": "#d9a679", "scratchId": "<iframe src=\"https://scratch.mit.edu/projects/408668962/embed\" allowtransparency=\"true\" width=\"485\" height=\"402\" frameborder=\"0\" scrolling=\"no\" allowfullscreen><\/iframe>\n", "obj": "This minigame required student to identify number patterns by determine the missing number on the rock. In this way will be able to attract student interest in learning.", "skills": "Pattern Recognition\nAnalyzing the number on the rock to determine the pattern number shown\n\nAbstraction\nFocusing on the number on the rock and do not distract by the music and animation of the minigame    \n\nAlgorithm\nFollow the procedures to complete the game\n1. Analyze the number on rock\n2. Determine the pattern number\n3. Calculate and give the correct number follow the flow of pattern number in the less time \n\nEvalution\nStudent knows whether their solution is correct after they made their decision, and if they made mistakes they can improve from it. \n", "s": "This activity is challenging since student need to answer the question with the limited time. It strengthen student ability to think fast and accurate at the same time. ", "e": "This activity is effective in trainning student to solve pattern number question within minutes. This can increases their ability and kownlegde on this topics.", "l": "This game is limited for student who are already mastered this topic. Beginner will struggle at finding the pattern waste time on it. Student cant learn the real concept of pattern in stead they are just chasing the time.", "i": "Take out the timer to create relax environment for student to learn and understand the concept of pattern number.", "img": "images/activity-3.jpg"}, {"type": "Plugged-in", "title": "LINEAR EQUATION: EXPLORING Y-INTERCEPTS IN GRAPHS", "blurb": "Plugged-in activity — GeoGebra", "c1": "#3a3a3a", "c2": "#b8864f", "skills": "Decomposition\nAnalyze the relationship between linear equation and graph sketching\n\nPattern Recognition \nStudents change the y-intercept repeatedly and identify the pattern that the line moves vertically while its slope remains unchanged.\n\nAbstraction\nStudents focus on the important relationship between the equation and graph rather than unnecessary visual details.\n\nAlgorithms \nStudents can follow a sequence: change the y-intercept → observe the graph → record the result → compare the changes → formulate a conclusion.\n\nLogical Reasoning\nStudents predict what will happen when the y-intercept changes from positive to negative and justify their prediction.\n\nEvaluation\nStudents compare their predictions with the actual GeoGebra graph and evaluate whether their mathematical reasoning is correct.\n", "scratchId": "https://www.geogebra.org/m/z4q2ghqp\n", "linkBox": "https://www.geogebra.org/m/z4q2ghqp\n\n", "obj": "This activity is mainly focusing on obtain y-intercept of linear graph by using the graph tool. This allow student visually learn the concept of linear equation and finding y-intercept.", "s": "GeoGebra is very interactive tool which allows students to immediately see the effect of changing the y-intercept. This makes the connection between the algebraic equation and graphical representation easier to understand.\n", "e": "The activity is effective in developing students' conceptual understanding of linear functions because it allows them to directly observe the relationship between changes in the y-intercept and changes in the graph.", "l": "The main activity limited only focus on the y-intercept. Therefore, students may not fully explore other aspects of linear functions, such as slope, rate of change and different forms of linear equations.", "i": "This activity can be improve by adding prediction questions.“If the y-intercept changes from 2 to 5, where do you predict the graph will move?” Students then test their prediction using GeoGebra. This strengthens logical reasoning and evaluation.\n", "img": "images/activity-4.jpg"}], "heroImg": "images/hero.jpg"};</script>

document.body.classList.toggle("home",r[0]!=="activities");document.getElementById("app").innerHTML=h;document.querySelector(".t").innerHTML=k("site","span");mark();window.scrollTo(0,0)}
function mark(){document.querySelectorAll("[data-k]").forEach(function(e){e.contentEditable=edit?"plaintext-only":"false"});
document.querySelectorAll("a.tile").forEach(function(a){a.draggable=!edit});
document.body.classList.toggle("edit",edit);
tEdit.textContent=edit?"Done editing":"Edit page";tAdd.hidden=tReset.hidden=tExp.hidden=!edit}
document.addEventListener("input",function(e){var p=e.target.dataset&&e.target.dataset.k;if(p){set(p,e.target.innerText);save()}});
document.addEventListener("focusout",function(e){var d=e.target.dataset;if(d&&d.k&&/(scratchId|ggb)$/.test(d.k)){var y=window.scrollY;route();window.scrollTo(0,y)}});
document.addEventListener("click",function(e){var t=e.target;
if(edit&&t.closest("a.tile")||edit&&t.closest("[data-k]")&&t.closest("a")){e.preventDefault()}
var d=t.closest("[data-del]");if(d&&confirm("Delete this activity?")){S.acts.splice(+d.dataset.del,1);save();route()}
var m=t.closest("[data-img]");if(edit&&m){e.preventDefault();img=m.dataset.img;file.click()}});
file.onchange=function(){var f=file.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var c=new Image();c.onload=function(){var s=Math.min(1,1000/c.width),cv=document.createElement("canvas");cv.width=c.width*s;cv.height=c.height*s;cv.getContext("2d").drawImage(c,0,0,cv.width,cv.height);set(img,cv.toDataURL("image/jpeg",.8));save();route()};c.src=r.result};r.readAsDataURL(f);file.value=""};
tEdit.onclick=function(){edit=!edit;mark()};
tAdd.onclick=function(){S.acts.push({type:"Unplugged",title:"New activity title",blurb:"Short description",c1:"#8f0a4a",c2:"#d9a679"});save();location.hash="#/activities/"+(S.acts.length-1)};
tExp.onclick=function(){var j=JSON.stringify(S),b=document.createElement("div");b.style.cssText="position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px";b.innerHTML='<div class="card" style="max-width:640px;width:100%"><h3>Your edits</h3><p>Copy everything below and paste it into the chat. It will be built into a final, locked version.</p><textarea readonly style="width:100%;height:200px;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px"></textarea><p><button class="btn" id="xc">Copy</button> <button class="btn light" id="xx">Close</button></p></div>';document.body.appendChild(b);var t=b.querySelector("textarea");t.value=j;t.select();b.querySelector("#xc").onclick=function(){t.select();try{document.execCommand("copy")}catch(e){}};b.querySelector("#xx").onclick=function(){b.remove()}};
tReset.onclick=function(){if(confirm("Discard all your edits and restore the original content?")){S=JSON.parse(JSON.stringify(D));save();route()}};
window.onhashchange=route;route();
</script>
